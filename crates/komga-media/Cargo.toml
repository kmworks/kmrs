[package]
name = "komga-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
komga-core = { path = "../komga-core" }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
image.workspace = true
jxl-image-rs-integration.workspace = true
hayro-jpeg2000.workspace = true
libheif-rs.workspace = true
zip = { workspace = true, features = ["bzip2", "deflate64", "lzma", "xz"] }
pdfium-render.workspace = true
roxmltree.workspace = true
scraper.workspace = true
quick-xml.workspace = true
unrar = "0.5"
icu_locale.workspace = true
xxhash-rust.workspace = true
md5.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1"
time.workspace = true
# Without the `image` feature: rxing pins an exact `image` release; pages are decoded here anyway.
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "encoding_rs", "oned"] }
tempfile = "3"
