[build.env]
# keep liblzma vendored inside cross's containers too
passthrough = [
  "LZMA_API_STATIC",
  "KMRS_OAUTH_ANILIST_CLIENT_ID",
  "KMRS_OAUTH_ANILIST_CLIENT_SECRET",
  "KMRS_OAUTH_MAL_CLIENT_ID",
  "KMRS_OAUTH_MAL_CLIENT_SECRET",
  "KMRS_OAUTH_BANGUMI_CLIENT_ID",
  "KMRS_OAUTH_BANGUMI_CLIENT_SECRET",
  "KMRS_OAUTH_MANGABAKA_CLIENT_ID",
  "KMRS_OAUTH_MANGABAKA_CLIENT_SECRET",
]

# cross 0.2.5's default images date from 2023 (Ubuntu 16.04, GCC 5) and cannot
# compile unrar's C++14; the main tags track cross's current Ubuntu 24.04 base
[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main"
pre-build = ["apt-get update && apt-get install -y pkg-config"]

[target.x86_64-unknown-linux-gnu.env]
passthrough = [
  "PKG_CONFIG_ALLOW_CROSS=1",
  "PKG_CONFIG_PATH=/project/.libheif-static/libheif-static-x86_64-unknown-linux-gnu/installed/x64-linux/lib/pkgconfig",
  "SYSTEM_DEPS_LIBHEIF_LINK=static",
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = ["apt-get update && apt-get install -y pkg-config"]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
  "PKG_CONFIG_ALLOW_CROSS=1",
  "PKG_CONFIG_PATH=/project/.libheif-static/libheif-static-aarch64-unknown-linux-gnu/installed/arm64-linux/lib/pkgconfig",
  "SYSTEM_DEPS_LIBHEIF_LINK=static",
]
