name: libheif release check

on:
  push:
    branches: [claude/libheif-rs]

env:
  LZMA_API_STATIC: "1"

jobs:
  cross:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --release --target ${{ matrix.target }} -p komga-server --features profiling
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
      - run: cross test --release --target ${{ matrix.target }} -p komga-media -- hooked_formats avif
      - run: readelf -d target/${{ matrix.target }}/release/kmrs | grep NEEDED
