name: libheif release check

on:
  push:
    branches: [claude/libheif-rs]

env:
  LZMA_API_STATIC: "1"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: cross
          - os: macos-latest
            target: aarch64-apple-darwin
            builder: cargo
          - os: macos-15-intel
            target: x86_64-apple-darwin
            builder: cargo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            builder: cargo
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-libheif
        with:
          target: ${{ matrix.target }}
      - if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - if: matrix.builder == 'cross'
        run: |
          cross build --release --target ${{ matrix.target }} -p komga-server
          cross test --release --target ${{ matrix.target }} -p komga-media -- hooked_formats avif
          readelf -d target/${{ matrix.target }}/release/kmrs | grep NEEDED
      - if: matrix.builder == 'cargo'
        run: |
          cargo build --release --target ${{ matrix.target }} -p komga-server
          cargo test --release --target ${{ matrix.target }} -p komga-media -- hooked_formats avif
      - if: runner.os == 'macOS'
        run: otool -L target/${{ matrix.target }}/release/kmrs
      - if: runner.os == 'Windows'
        run: ldd target/${{ matrix.target }}/release/kmrs.exe | grep -viE 'system32|ntdll' || true
      - run: ls -l target/${{ matrix.target }}/release/ | grep -E ' kmrs(\.exe)?$'
