name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    # gate the heavy legs: rust jobs skip web-only PRs, the web job skips rust-only PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # push events diff with git commands and need the checkout; PRs go through the API
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # some-with-excludes: a file must hit an include and no exclude —
          # under the default 'some' the '**' would swallow the exclusion
          predicate-quantifier: 'some-with-excludes'
          filters: |
            rust:
              - '**'
              - '!webui/**'
            web:
              - 'webui/**'

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # registry downloads only; compile caching is sccache's job.
          # target/ is never restored, so stale build-script outputs
          # (e.g. pkg-config probe results from another runner image)
          # cannot leak across runs
          cache-targets: "false"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo nextest run --workspace

  build:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # compile-only gate on the platforms the release workflow ships;
    # tests stay on ubuntu
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      # hermetic liblzma regardless of runner image contents
      LZMA_API_STATIC: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo build --workspace --all-targets
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item target\debug\kmrs.exe packaging\windows\kmrs.exe
          Copy-Item crates\komga-server\resources\windows\kmrs.ico packaging\windows\kmrs.ico
          New-Item -ItemType Directory -Path pdfium, packaging\windows\PDFium | Out-Null
          curl.exe -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8125/pdfium-win-x64.tgz" -o pdfium.tgz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar.exe -xzf pdfium.tgz -C pdfium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item pdfium\bin\pdfium.dll packaging\windows\pdfium.dll
          Copy-Item pdfium\LICENSE packaging\windows\PDFium\
          Copy-Item -Recurse pdfium\licenses packaging\windows\PDFium\
          choco install nsis --no-progress -y
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }
          & $makensis /DVERSION=0.0.0 /DOUTFILE="$PWD\KMServer-setup.exe" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item packaging\windows\kmrs.exe, packaging\windows\kmrs.ico, packaging\windows\pdfium.dll
          Remove-Item -Recurse packaging\windows\PDFium, pdfium
          Remove-Item pdfium.tgz

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docker:
    # build glibc (2.39) must not exceed the debian:trixie-slim runtime's (2.41)
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: ./.github/actions/build-webui
      - run: cargo build -p komga-server
        env:
          # hermetic liblzma regardless of runner image contents
          LZMA_API_STATIC: "1"
      - run: mkdir -p dist/amd64 && cp target/debug/kmrs dist/amd64/
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kmrs:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          trap 'docker logs kmrs' ERR
          docker run -d --name kmrs --user 1000:1000 -p 25600:25600 kmrs:test
          for i in $(seq 1 30); do
            curl -sf http://localhost:25600/actuator/health > /dev/null && break || sleep 2
          done
          # the bundled web UI is served at /
          curl -sf http://localhost:25600/ | grep -q "<title>KMReader</title>"
          # the API is up and the database answers: claim status on a fresh install
          curl -sf http://localhost:25600/api/v1/claim | grep -q '"isClaimed":false'

  ci:
    # the single check the default-branch ruleset pins: a matrix leg skipped by
    # the job-level if reports under one bare name, so requiring the expanded
    # "build (os)" names blocks every web-only PR on a check that never runs
    needs: [lint, test, build, web, docker]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Every leg passed or was filtered out
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          [ -z "$failed" ] || { echo "red legs: $failed"; exit 1; }
          echo "all legs green or filtered out"
