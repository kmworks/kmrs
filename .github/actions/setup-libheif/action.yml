name: Set up libheif
description: Fetch the prebuilt static libheif the build links against

inputs:
  target:
    description: Rust target triple; defaults to the host
    required: false

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        target="${TARGET:-$(rustc -vV | sed -n 's/^host: //p')}"
        case "$target" in
          x86_64-unknown-linux-gnu) triplet=x64-linux ;;
          aarch64-unknown-linux-gnu) triplet=arm64-linux ;;
          aarch64-apple-darwin) triplet=arm64-osx ;;
          x86_64-pc-windows-msvc) triplet=x64-windows-static-md ;;
          *) echo "no libheif archive for $target" >&2; exit 1 ;;
        esac

        pin="$GITHUB_ACTION_PATH/../../libheif-static"
        archive="libheif-static-$target.tar.gz"
        mkdir -p .libheif-static
        curl -fsSL --retry 3 -o ".libheif-static/$archive" \
          "https://github.com/kmworks/libheif-static/releases/download/$(tr -d '\r' < "$pin/VERSION")/$archive"
        # Windows checkouts may carry CRLF
        tr -d '\r' < "$pin/SHA256SUMS" | grep " $archive\$" > .libheif-static/expected
        if command -v sha256sum > /dev/null; then
          (cd .libheif-static && sha256sum -c expected)
        else
          (cd .libheif-static && shasum -a 256 -c expected)
        fi
        tar -xzf ".libheif-static/$archive" -C .libheif-static

        root="$PWD/.libheif-static/libheif-static-$target"
        if [ "$RUNNER_OS" = Windows ]; then
          echo "VCPKG_ROOT=$(cygpath -w "$root")" >> "$GITHUB_ENV"
          echo "VCPKGRS_TRIPLET=$triplet" >> "$GITHUB_ENV"
        else
          echo "PKG_CONFIG_PATH=$root/installed/$triplet/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_LIBHEIF_LINK=static" >> "$GITHUB_ENV"
        fi
